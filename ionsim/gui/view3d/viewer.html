<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#d7dce4}
#view{position:fixed;inset:0}
#panel{position:fixed;top:12px;left:12px;background:rgba(18,22,30,.86);border:1px solid #2a3140;border-radius:8px;padding:10px 12px;width:240px;max-height:calc(100% - 48px);overflow:auto}
#panel label{display:flex;align-items:center;gap:6px;margin:5px 0}#panel input[type=range]{flex:1;min-width:60px}
#panel .btns{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}#panel button{background:#232b3a;color:#d7dce4;border:1px solid #344057;border-radius:5px;padding:3px 7px;cursor:pointer}
#panel button:hover{background:#2c3649}
#panel .hint{color:#8a93a3;font-size:12px;margin-top:6px}
#title{position:fixed;top:12px;right:14px;text-align:right;color:#aab3c2;font-size:12px;max-width:45%}
#title b{color:#d7dce4;font-size:13px}
#legend{position:fixed;right:14px;bottom:14px;background:rgba(18,22,30,.86);border:1px solid #2a3140;border-radius:8px;padding:10px 12px;width:240px}
#legend .row{display:flex;align-items:center;gap:8px;margin:3px 0}#legend .sw{width:26px;height:4px;border-radius:2px;display:inline-block;flex:none}
#legend .bar{height:10px;border-radius:3px;margin:8px 0 2px}#legend .ticks{display:flex;justify-content:space-between;color:#8a93a3;font-size:11px}
#legend .note{color:#8a93a3;font-size:11px;margin-top:4px}
#foot{position:fixed;left:14px;bottom:10px;color:#6c7586;font-size:11px}
</style></head><body><div id="view"></div><div id="panel"></div><div id="title"></div><div id="legend"></div><div id="foot"></div>
<script>/*SCENE*/</script><script>/*APP*/</script></body></html>
