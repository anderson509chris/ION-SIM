# Builds the standalone app for Windows, macOS and Linux on every push.
# Download the zips from the run's "Artifacts" section on the Actions tab.
name: build-app
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm ion_sim.spec
      - uses: actions/upload-artifact@v4
        with:
          name: IonSim-${{ runner.os }}
          path: dist/
