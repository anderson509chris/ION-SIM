# Builds the standalone app for Windows, macOS and Linux on every push.
# Download the zips from the run's "Artifacts" section on the Actions tab.
name: build-app
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux system libraries (gmsh needs libGLU, Qt needs EGL/xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libegl1 libxkbcommon0
      - run: pip install -r requirements.txt pyinstaller
      - name: Smoke test (imports, DXF/STEP import, quick solves, the app window)
        run: python tests/smoke_test.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm ion_sim.spec
      - uses: actions/upload-artifact@v4
        with:
          name: IonSim-${{ runner.os }}
          path: dist/
